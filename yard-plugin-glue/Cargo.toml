[package]
name = "yard-plugin-glue"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yard-plugin-glue"
path = "src/main.rs"

[dependencies]
yard-plugin-sdk = { workspace = true }
yard-plugin-common = { path = "../yard-plugin-common" }
anyhow = { workspace = true }
aws-sdk-glue = { version = "1.163", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
